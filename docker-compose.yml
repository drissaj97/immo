services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: samsar
      POSTGRES_PASSWORD: samsar_dev
      POSTGRES_DB: samsar
    ports:
      - "5432:5432"
    volumes:
      - samsar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samsar -d samsar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  samsar_pg_data:
